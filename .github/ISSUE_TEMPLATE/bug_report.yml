name: Bug report
description: Something is broken or behaving unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** paste lyric text into this issue — the track
        title and artist are enough to reproduce a matching problem.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Play a track on music.youtube.com
        2. Open the lyrics panel
        3. ...
    validations:
      required: true

  - type: input
    id: footer
    attributes:
      label: Panel footer text
      description: The status line at the bottom of the lyrics panel when the problem occurred.
      placeholder: e.g. "Waiting for the browser bridge to connect…"

  - type: input
    id: track
    attributes:
      label: Track title and artist
      description: Only if this is a lyrics-matching problem. Title and artist only, no lyrics.

  - type: input
    id: versions
    attributes:
      label: Environment
      placeholder: macOS 26.5, VS Code 1.95, Chrome 131, extension 0.1.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Anything from the VS Code Developer Tools console or the browser extension's service worker console.
      render: shell
